<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My interface</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<header>
  <h1>My interface</h1>
  <span id="state" class="state">Connecting…</span>
  <button id="live" type="button" aria-pressed="false">Listen live</button>
</header>

<main>
  <section>
    <h2>On the air</h2>
    <ul id="air" class="calls"></ul>
  </section>

  <section>
    <h2>Recorded</h2>
    <ul id="recorded" class="calls"></ul>
  </section>
</main>

<audio id="player" preload="none"></audio>
</body>
</html>
